# AdeImmo, stack de developpement local.
#
# La base Postgres locale sert au developpement hors ligne et aux tests.
# Supabase distant n'est utilise que pour Auth et Storage, via les variables
# d'environnement de backend/.env et frontend/.env.local.

services:
  db:
    image: postgres:16-alpine
    container_name: adeimmo-db
    environment:
      POSTGRES_USER: adeimmo
      POSTGRES_PASSWORD: adeimmo
      POSTGRES_DB: adeimmo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adeimmo -d adeimmo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adeimmo-backend
    env_file:
      - ./backend/.env
    environment:
      # Surcharge l'URL du .env pour viser le conteneur Postgres local.
      DATABASE_URL: postgresql+psycopg://adeimmo:adeimmo@db:5432/adeimmo
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adeimmo-frontend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  db_data:
